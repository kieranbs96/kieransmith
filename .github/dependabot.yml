version: 2

updates:
  # Keep npm dependencies up to date
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/London
    open-pull-requests-limit: 10
    groups:
      # Batch minor/patch bumps into one PR to cut down on noise
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  # Keep GitHub Actions versions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/London
    labels:
      - dependencies
      - ci
